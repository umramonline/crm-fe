name: Deploy to Production

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production-crm-fe
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    uses: ./.github/workflows/build-frontend.yml
    with:
      vite_api_base_url: ${{ vars.VITE_API_BASE_URL }}

  deploy:
    name: Deploy to Production
    needs: [ci, build]
    runs-on: self-hosted
    environment: production
    timeout-minutes: 15

    permissions:
      contents: read

    env:
      FE_DEPLOY_DIR: ${{ vars.FE_DEPLOY_DIR }}
      HEALTH_CHECK_URL: ${{ vars.HEALTH_CHECK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate deploy configuration
        run: |
          if [ -z "${{ vars.VITE_API_BASE_URL }}" ]; then
            echo "Set production Environment variable VITE_API_BASE_URL"
            exit 1
          fi
          if [ -z "$FE_DEPLOY_DIR" ]; then
            echo "Set production Environment variable FE_DEPLOY_DIR"
            exit 1
          fi
          if [ -z "$HEALTH_CHECK_URL" ]; then
            echo "Set production Environment variable HEALTH_CHECK_URL"
            exit 1
          fi

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H ${{ secrets.PROD_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy static assets via rsync
        run: |
          rsync -az --delete dist/ \
            "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:${FE_DEPLOY_DIR}/"

      - name: Health check
        run: |
          URL="${HEALTH_CHECK_URL}"
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 15 "$URL" > /dev/null; then
              echo "Health check passed: $URL"
              exit 0
            fi
            echo "Attempt ${attempt}/5 failed, retrying in 5s..."
            sleep 5
          done
          echo "Health check failed: $URL"
          exit 1
